<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Steele Cards</title><meta name="robots" content="noindex,nofollow,noimageindex">
<script>
// Steele Cards moved to lybs-cards.web.app. Every old link (and every saved home-screen app) lands there.
// Old family links look like ?player=first-last, but the 2026 packs know each kid as first_last,
// so the name is rewritten first; otherwise the pack opens the wrong kid. Retired pages (like
// montachusett_11u_pack.html) don't exist on the new site, so player links go to its front page,
// which opens the 2026 pack for that player with no code.
(function(){var base="https://lybs-cards.web.app";
var path=location.pathname.replace(/^\/lybs-cards/,"")||"/";
var p=new URLSearchParams(location.search),dest="/";
if(p.has("player")){p.set("player",String(p.get("player")||"").trim().toLowerCase().replace(/[\s.\-]+/g,"_").replace(/[^a-z0-9_]/g,""));}
else if(p.has("gift")){}
else if(p.has("pack")){dest="/pack.html";}
else if(path==="/admin.html"){dest="/admin.html";}
var qs=p.toString();location.replace(base+dest+(qs?"?"+qs:"")+location.hash);})();
</script>
<meta http-equiv="refresh" content="2;url=https://lybs-cards.web.app/">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#05070d;color:#fff;font:15px system-ui,sans-serif;text-align:center}a{color:#E2B32C}</style>
</head><body><p>Opening Steele Cards…<br><a href="https://lybs-cards.web.app/">Tap here if it doesn't open</a></p></body></html>

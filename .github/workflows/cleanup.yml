name: One-time branch cleanup
on:
  push:
    branches: [main]
    paths: [.github/workflows/cleanup.yml]
permissions:
  contents: write
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the old branch that still holds the card photos
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/claude/a-20261103-cards-remove-archive" || echo "already gone"

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Steele Cards Card Maker</title><meta name="robots" content="noindex,nofollow,noimageindex">
<meta name="theme-color" content="#05070d">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;600&display=swap">
<style>
:root{--bg:#05070d;--panel:#0d1330;--line:#24306a;--text:#fff;--muted:#aab3d6;--blue:#1B3FD8;--silver:#C9D1D6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:16px;text-align:center;font:400 28px Anton,Impact,sans-serif;letter-spacing:.04em}
header small{display:block;font:500 13px system-ui,sans-serif;color:var(--muted);letter-spacing:0;margin-top:4px}
main{max-width:980px;margin:0 auto;padding:0 16px 32px;display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
@media(min-width:820px){main{grid-template-columns:minmax(0,1fr) 380px}}
.stage{display:grid;gap:12px;justify-items:center}
canvas{width:100%;max-width:420px;height:auto;border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.6)}
.flip{display:flex;gap:8px}
button,.btn{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:12px 16px;font:600 15px system-ui,sans-serif;min-height:44px;cursor:pointer}
button[aria-pressed=true],.primary{background:var(--blue);border-color:var(--blue)}
form{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;align-content:start}
label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
input,select{width:100%;min-height:44px;border-radius:8px;border:1px solid var(--line);background:#060a1f;color:var(--text);padding:8px 10px;font:16px system-ui,sans-serif}
input[type=color]{padding:2px}
input[type=range]{min-height:32px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.note{font-size:13px;color:var(--muted);margin:0}
#msg{min-height:1.2em;font-size:14px;color:#ffd166}
</style></head>
<body>
<header>STEELE CARDS CARD MAKER<small>Try a card here. Your photo stays on this phone: nothing is uploaded or saved.</small></header>
<main>
  <section class="stage">
    <canvas id="card" width="750" height="1050" aria-label="Card preview"></canvas>
    <div class="flip">
      <button type="button" id="showFront" aria-pressed="true">Front</button>
      <button type="button" id="showBack" aria-pressed="false">Back</button>
      <button type="button" id="save" class="primary">Save picture</button>
    </div>
    <p id="msg" role="status"></p>
  </section>
  <form id="f" autocomplete="off">
    <label>Photo<input type="file" id="photo" accept="image/*"></label>
    <div class="row"><label>Zoom<input type="range" id="zoom" min="1" max="3" step="0.05" value="1"></label>
      <label>Up / down<input type="range" id="dy" min="-1" max="1" step="0.02" value="0"></label></div>
    <label>Left / right<input type="range" id="dx" min="-1" max="1" step="0.02" value="0"></label>
    <div class="row"><label>First name<input id="first" value="Sample"></label><label>Last name<input id="last" value="Player"></label></div>
    <div class="row3"><label>Number<input id="number" inputmode="numeric" value="00"></label>
      <label>Position<input id="position" value="SS/P"></label>
      <label>Bats/Throws<select id="bt"><option></option><option>R/R</option><option>L/L</option><option>L/R</option><option>R/L</option><option>S/R</option><option>S/L</option></select></label></div>
    <div class="row"><label>Team<input id="team" value="Sample Team"></label><label>Division<input id="division" value="Majors"></label></div>
    <div class="row"><label>Set<input id="setName" value="LYBS"></label><label>Season<input id="season" value="2026"></label></div>
    <div class="row3"><label>Main color<input type="color" id="primary" value="#1B3FD8"></label>
      <label>Dark color<input type="color" id="deep" value="#0A1033"></label>
      <label>Trim color<input type="color" id="accent" value="#C9D1D6"></label></div>
    <p class="note">In the team app this fills itself from the roster once the board approves a photo.</p>
  </form>
</main>
<script src="card-kit.js"></script>
<script>
(function () {
  const K = window.SteeleCardKit, $ = id => document.getElementById(id), canvas = $("card");
  let side = "front", photo = null;
  const ids = ["first", "last", "number", "position", "bt", "team", "division", "setName", "season", "primary", "deep", "accent", "zoom", "dx", "dy"];
  function data() {
    return K.cardData(
      { first: $("first").value, last: $("last").value, number: $("number").value, position: $("position").value, batsThrows: $("bt").value },
      { name: $("team").value, division: $("division").value, primary: $("primary").value, deep: $("deep").value, accent: $("accent").value },
      { name: $("setName").value, season: $("season").value });
  }
  function draw() {
    const d = data();
    if (side === "front") K.drawFront(canvas, d, photo, { zoom: +$("zoom").value, dx: +$("dx").value, dy: +$("dy").value });
    else K.drawBack(canvas, d);
    $("showFront").setAttribute("aria-pressed", side === "front"); $("showBack").setAttribute("aria-pressed", side === "back");
  }
  ids.forEach(id => $(id).addEventListener("input", draw));
  $("showFront").onclick = () => { side = "front"; draw(); };
  $("showBack").onclick = () => { side = "back"; draw(); };
  $("photo").addEventListener("change", async e => {
    const file = e.target.files && e.target.files[0]; if (!file) return;
    $("msg").textContent = "Getting the photo ready…";
    try {
      const cleaned = await K.cleanPhoto(file);
      photo = await K.loadImage(cleaned.dataUrl);
      $("zoom").value = 1; $("dx").value = 0; $("dy").value = 0; side = "front";
      $("msg").textContent = "Photo ready. Location and camera details were removed.";
      draw();
    } catch (err) { $("msg").textContent = err.message || "Couldn't use that photo. Try another."; }
  });
  $("save").onclick = () => {
    canvas.toBlob(b => {
      const a = document.createElement("a"), d = data();
      a.href = URL.createObjectURL(b);
      a.download = ("steele-card-" + (d.last || d.first || "player") + "-" + side).toLowerCase().replace(/[^a-z0-9-]+/g, "-") + ".png";
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    }, "image/png");
  };
  draw();
  if (document.fonts && document.fonts.load) Promise.all([document.fonts.load("40px Anton"), document.fonts.load("500 30px Oswald")]).then(draw, () => {});
  window.__cardMaker = { draw, get photo() { return photo; } };
})();
</script>
</body></html>
